name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # woechentlicher Rebuild (Montag), um Basis-Image-Updates mitzunehmen
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify webhook (z. B. Watchtower)
        if: env.WEBHOOK_URL != ''
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o webhook-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 600 \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN")
          echo "webhook: HTTP $http_code"
          cat webhook-response.json 2>/dev/null; echo
          if [ "$http_code" != "200" ]; then
            echo "::error::webhook failed (HTTP $http_code)"
            exit 1
          fi

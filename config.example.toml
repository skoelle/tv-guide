# Kopie als config.toml speichern und anpassen: vim config.toml
# Relative Pfade gelten ab dem Ordner, in dem diese Datei liegt.

[paths]
epg_db  = "data/epg.db"      # von tools/epg_import.py, wird nur gelesen
imdb_db = "data/imdb.db"     # von tools/imdb_build.py, wird nur gelesen
app_db  = "data/app.db"      # gehoert der App (Zuordnungen, Suchen, Overrides)
ignore_channels_file = "channels_ignore.txt"

[server]
host = "0.0.0.0"
port = 8085
base_url = "http://xubuntu-dev:8085"   # fuer Links in E-Mails, ohne Schraegstrich am Ende
timezone = "Europe/Berlin"

[matching]
auto_threshold = 1.0         # Score ab hier: auto
review_threshold = 0.6       # Score ab hier: review
# Wiederkehrende Serien-Praefixe/-Suffixe (z. B. "Tatort - ...") staerker bewerten.
franchise_auto = true
franchise_min_shows = 3      # ab so vielen Shows gilt ein Praefix/Suffix als Franchise
franchise_bonus = 0.15
franchise_mismatch_penalty = 0.15
suffix_penalty = 0.15
combined_name_bonus = 0.25   # alle Titel-Teile sind exakte Aliase desselben Werks

[retro]
from_year = 1980
to_year = 1999
end_max = 2009               # Serie gilt als abgeschlossen, wenn Ende bis dahin

# Vorfilter beim Matching: Sendungen werden nicht zugeordnet.
# Kategorien werden als Praefix verglichen (exakte EPG-Strings).
[skip]
categories = [
    "News",
    "Leisure hobbies : Advertisement",
    "Sports",
    "Social / Political",
    "Education / Science",
    "Children's / Youth programs : Pre-school",
]
titles = [
    "teleshopping", "sendeschluss", "tagesschau", "heute", "tagesthemen", "wetter",
    "nachrichten", "programmhinweis", "sendepause", "werbung", "infokanal", "infomercial",
    "derzeit keine uebertragung",
]
min_duration = 8             # Median-Laenge in Minuten: kuerzer -> skip_short
block_min_duration = 100     # ohne Kategorie, ab dieser Laenge ...
block_min_events = 10        # ... und so vielen Terminen -> skip_block

# Datenquellen fuer Import/Build im Container (Buttons in /status und Scheduler)
[epg]
url = "http://docker-host-nas.fritz.box:9981/xmltv/channels"
user = ""                    # Passwort kommt aus TVGUIDE_TVH_PASSWORD
prune_days = 0               # 0 = nie

# Serien-Timer aus der Werk-Detailansicht. Das Passwort kommt aus
# TVGUIDE_TVH_PASSWORD; der Benutzer braucht DVR-/Recorder-Rechte.
[tvheadend]
url = ""                     # leer = aus [epg].url ableiten
user = ""                    # leer = [epg].user verwenden
dvr_config = ""              # DVR-Profilname oder UUID, leer = Standardprofil

[imdb]
raw_dir = "imdb_raw"         # Rohdatensatz, gross; separater Mount ausserhalb von data/
types = "movie,tvMovie,tvSeries,tvMiniSeries"
min_votes = 0
min_year = 0                 # 0 = aus
with_episodes = true
with_crew = true             # Regie/Drehbuch
with_cast = true             # Besetzung (title.principals + name.basics)
cast_limit = 15              # hoechstes principals.ordering pro Titel

# Zeitplan im Container. Lokal/Dev aus; docker-compose setzt TVGUIDE_SCHEDULE_ENABLED=true.
[schedule]
enabled = false
epg_every_minutes = 60       # stuendlich pruefen, nur bei Aenderung neu matchen
                             # erster EPG-Wechsel pro Tag: IMDb-Build + Poster + Matching

# Poster von TMDB. Token/Key kommen aus dem Environment:
# TVGUIDE_TMDB_READ_TOKEN (bevorzugt) oder TVGUIDE_TMDB_API_KEY.
[posters]
enabled = true
language = "de-DE"
image_size = "w342"          # TMDB-Bildgroesse, z.B. w185, w342, w500
cache_dir = "data/posters"   # lokaler Bild-Cache (app.db speichert die Rohdaten)
refresh_days = 180           # TMDB erlaubt Caching maximal 6 Monate
missing_retry_days = 30      # Titel ohne Poster seltener erneut pruefen
error_retry_days = 1         # Fehler am naechsten Tag erneut versuchen
request_delay = 0.3          # Sekunden zwischen API-Aufrufen (TMDB: 40/10s)

# Sendergruppen fuer Filter (exakte Sendernamen aus dem EPG)
[channel_groups]
retro = ["TELE 5", "Kabel Eins", "RTLNITRO", "Pro7 MAXX", "SAT.1 Gold", "ONE", "RTLZWEI"]

# Ab M7 (E-Mail). Das Passwort kommt aus der Umgebungsvariable TVGUIDE_SMTP_PASSWORD.
[smtp]
host = ""
port = 587
security = "starttls"        # starttls | ssl
username = ""
from = ""
to = []

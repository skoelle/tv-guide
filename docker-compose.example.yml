# Beispiel: Image aus der GitHub-Container-Registry ziehen (kein lokaler Build).
# Nach docker-compose.yml kopieren und die Pfade anpassen.
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose pull
#   docker compose up -d
#
# Das Image enthaelt nur den Code. config.toml und data/ (epg.db, imdb.db, app.db)
# werden als Volumes eingebunden und bleiben lokal.
services:
  tvguide:
    image: ghcr.io/skoelle/tv-guide:latest
    container_name: tv-guide
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - /srv/docker/tv-guide/config.toml:/app/config.toml:ro
      - /srv/docker/tv-guide/channels_ignore.txt:/app/channels_ignore.txt:ro
      - /srv/docker/tv-guide/data:/app/data
      # Raw IMDb datasets live outside data/ so the data backup stays small.
      - /docker-data/volumes/tv-guide/imdb_raw:/app/imdb_raw
    environment:
      TZ: Europe/Berlin
      TVGUIDE_SMTP_PASSWORD: "${TVGUIDE_SMTP_PASSWORD:-}"
      TVGUIDE_TVH_PASSWORD: "${TVGUIDE_TVH_PASSWORD:-}"
      TVGUIDE_TMDB_READ_TOKEN: "${TVGUIDE_TMDB_READ_TOKEN:-}"
      TVGUIDE_TMDB_API_KEY: "${TVGUIDE_TMDB_API_KEY:-}"
      TVGUIDE_SCHEDULE_ENABLED: "true"
    labels:
      - com.centurylinklabs.watchtower.enable=true

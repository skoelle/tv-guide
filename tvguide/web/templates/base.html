<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TV-Guide{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">TV-Guide</a>
  <nav>
    <a href="/" class="{{ 'on' if active == 'jetzt' }}">Jetzt</a>
    <span class="soon" title="kommt in M4">Stöbern</span>
    <span class="soon" title="kommt in M6">Suchen</span>
    <span class="soon" title="kommt in M5">Review</span>
    <a href="/status" class="{{ 'on' if active == 'status' }}">Status</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  tvguide {{ version }} &middot; Information courtesy of IMDb (<a href="https://www.imdb.com">imdb.com</a>). Nur für persönliche, nicht kommerzielle Nutzung.
</footer>
</body>
</html>

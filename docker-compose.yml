services:
  tvguide:
    build: .
    image: tvguide:latest
    container_name: tv-guide
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./channels_ignore.txt:/app/channels_ignore.txt:ro
      - ./data:/app/data
    environment:
      - TZ=Europe/Berlin
      - TVGUIDE_SMTP_PASSWORD=${TVGUIDE_SMTP_PASSWORD:-}
      - TVGUIDE_TVH_PASSWORD=${TVGUIDE_TVH_PASSWORD:-}
      - TVGUIDE_SCHEDULE_ENABLED=true
